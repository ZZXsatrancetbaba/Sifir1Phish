; =============================================================================
; Master Gombit - PHP güvenlik ayarları (lokal eğitim ortamı)
; Production benzeri güvenli varsayılanlar. Detaylı hata YALNIZCA feature flag.
; =============================================================================

; --- Hata gösterimi: ekrana stack trace sızmaz (uygulama handler'ı karar verir)
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /var/www/html/storage/logs/php_error.log

; --- Bilgi sızıntısı önleme
expose_php = Off
session.use_strict_mode = 1
session.cookie_httponly = 1
session.cookie_samesite = "Lax"
session.cookie_secure = 0            ; Lokal HTTP; HTTPS ortamında 1 yapılmalı
session.use_only_cookies = 1
session.sid_length = 48
session.sid_bits_per_character = 6
session.gc_maxlifetime = 1800        ; 30 dk oturum

; --- Upload sertleştirme
file_uploads = On
upload_max_filesize = 2M
post_max_size = 3M
max_file_uploads = 5
memory_limit = 128M
max_execution_time = 15

; --- Tehlikeli örnekleme/comparison fonksiyonları kapalı
disable_functions = exec,passthru,shell_exec,system,proc_open,popen,curl_multi_exec,parse_ini_file,show_source

; --- Zaman
date.timezone = Europe/Istanbul

; --- OPcache
opcache.enable = 1
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2
