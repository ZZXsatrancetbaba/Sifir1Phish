# =============================================================================
# Master Gombit - Nginx konfigürasyonu (lokal eğitim)
# Güvenlik notları:
#  - server_tokens off: sürüm sızıntısı yok
#  - storage/, app/, config/, vendor/ webroot DIŞINDA tutulur (deny-all)
#  - Gerekli header'ların bir kısmı uygulama katmanında da set edilir
#    (Defense in Depth)
# =============================================================================
server_tokens off;

server {
    listen 80 default_server;
    server_name _;
    root /var/www/html/public;
    index index.php;

    # --- Genel sertleştirme ---
    client_max_body_size 2m;            # dosya yükleme limiti (uygulamada da var)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # --- Webroot dışı dizinlere erişim engeli ---
    location ~ /\.(env|git|htaccess) { deny all; return 404; }
    location ^~ /storage/ { deny all; return 404; }

    # --- Statik varlıklar ---
    location ^~ /assets/ {
        expires 1h;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # --- PHP işleme: yalnızca public/ altındaki .php dosyaları ---
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
    }

    # --- Front controller ---
    location / {
        try_files $uri $uri/ /index.php$is_args$args;
    }

    # Health check (loglama kapalı - gürültü azaltma)
    location = /health.php {
        access_log off;
        try_files $uri =404;
    }

    error_log /var/log/nginx/mg_error.log warn;
    access_log /var/log/nginx/mg_access.log combined buffer=16k flush=5s;
}
